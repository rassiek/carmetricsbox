<!DOCTYPE html>
<html>
<head>
    <title>GPIO Control Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="all.css"> <!-- Common styles -->
    <link rel="stylesheet" type="text/css" href="style.css"> <!-- Main dashboard styles -->
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        .topnav { background-color: #333; overflow: hidden; padding: 10px; text-align: center;}
        .topnav h1 { color: white; margin: 0; font-size: 1.5em; }
        .topnav a { color: white; padding: 14px 16px; text-decoration: none; font-size: 1em; }
        .topnav a:hover { background-color: #ddd; color: black; }
        .content { padding: 20px; }
        .gpio-controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .gpio-card {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            background-color: #f9f9f9;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .gpio-card h3 {
            margin-top: 0;
            font-size: 1.2em;
            color: #333;
        }
        .gpio-card p { margin: 5px 0; font-size: 0.9em; }
        .gpio-card button {
            margin-top: 5px;
            margin-right: 5px;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #5cb85c;
            color: white;
        }
        .gpio-card button.off { background-color: #d9534f; }
        .gpio-card button.blink-toggle.active { background-color: #f0ad4e; }
        .gpio-card input[type="number"] {
            width: 80px;
            padding: 6px;
            margin-right: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .status-message {
            padding: 10px; margin-bottom: 15px; border-radius: 4px;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="topnav">
        <h1>GPIO Control Panel</h1>
        <a href="index.html">View Gauges</a>
        <a href="settings.html">Settings</a>
    </div>

    <div class="content">
        <div id="status-messages-gpio"></div>
        <div id="gpio-controls-area" class="gpio-controls-grid">
            <p>Loading GPIO controls...</p>
            <!-- GPIO controls will be dynamically inserted here -->
        </div>
    </div>

    <script src="gpio_control.js"></script>
</body>
</html>
