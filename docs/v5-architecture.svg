<text x="124" y="80" font-weight="600">Phone or tablet</text><text x="124" y="98" font-size="11.5" fill="#59636e">Web UI, the primary display</text>
<text x="380" y="80" font-weight="600">Internet (optional)</text><text x="380" y="98" font-size="11.5" fill="#59636e">Cloud upload, weather, time</text>
<text x="636" y="80" font-weight="600">Touch display (optional)</text><text x="636" y="98" font-size="11.5" fill="#59636e">e.g. JC3248W535</text>
<text x="187" y="134" font-size="11.5" fill="#59636e">Wi-Fi</text><text x="573" y="134" font-size="11.5" fill="#59636e">ESP-NOW or Wi-Fi</text>
<text x="380" y="196" font-size="15" font-weight="600">Main board (default: the only one)</text>
<text x="380" y="220" font-size="11.5">Web UI + API, configuration, history</text>
<text x="380" y="238" font-size="11.5">Local sensors, alarms, buzzer, relays</text>
<text x="380" y="256" font-size="11.5">Cloud upload, weather, saved Wi-Fi</text>
<text x="380" y="274" font-size="11.5" fill="#59636e">ESP32 or ESP32-S3, dual core</text>
<text x="661" y="224" font-weight="600">OLED (optional)</text><text x="661" y="242" font-size="11.5" fill="#59636e">I2C, on the main board</text>
<text x="190" y="414" font-weight="600">Sensor board (optional)</text><text x="190" y="432" font-size="11.5">Engine bay: temps, pressures, EGT</text><text x="190" y="450" font-size="11.5" fill="#59636e">Alarms locally if the link drops</text>
<text x="570" y="414" font-weight="600">Relay board (optional)</text><text x="570" y="432" font-size="11.5">Fans, lights, pumps near the loads</text><text x="570" y="450" font-size="11.5" fill="#59636e">Safe state if the link drops</text>
</g>
<text x="390" y="146" font-size="11.5" fill="#59636e">Wi-Fi (joined network)</text>
