<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a10">
  <title>CarMetrics - Charts</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="app.css">
  <script src="app.js"></script>
</head>
<body>
  <main>
    <p class="muted small" id="span">Last 30 minutes, kept on the ESP32 (cleared on reboot or when sensors change).</p>
    <div id="charts" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr))"></div>
  </main>
  <script src="charts.js"></script>
</body>
</html>
